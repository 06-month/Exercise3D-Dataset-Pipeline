name: publication-safety

on:
  push:
  pull_request:

jobs:
  source-and-privacy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 공개 파일 안전 검사
        run: python tools/check_publication_safety.py --all
      - name: Python 구문 검사
        run: python -m compileall -q scripts tools
